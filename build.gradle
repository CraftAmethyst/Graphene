plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java {
    toolchain.languageVersion = JavaLanguageVersion.of(22)
    modularity.inferModulePath = true
}

repositories {
    mavenLocal()
    maven { url = uri("build/local-repo") }
    mavenCentral()
    // LWJGL official repository for natives/classifiers
    maven { url = 'https://repo.lwjgl.org/release' }
    maven { url = 'https://maven.neoforged.net/releases' }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    maven { url = 'https://jitpack.io' }
    maven {
        name = 'CodeMC-OcclusionCulling'
        url = 'https://ci.codemc.io/job/LogisticsCraft/job/OcclusionCulling/lastSuccessfulBuild/artifact/'
    }
    maven { url 'https://repo.codemc.io/repository/maven-public/' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'org.joml:joml:1.10.5'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'
    implementation 'com.esotericsoftware:kryo:5.6.2'

    // LWJGL OpenCL for server-side GPU compute (OpenCL)
    implementation platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-opencl'
    // Platform natives (build host only)
    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'

    compileOnly files('lib/cloth.jar')
    compileOnly files('lib/config.jar')
    implementation "com.logisticscraft:occlusionculling:0.0.8-SNAPSHOT"
    compileOnly 'org.projectlombok:lombok:1.18.34'
    compileOnly "maven.modrinth:applied-energistics-2-wireless-terminals:IQFaf9vp"
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    jarJar('com.github.ben-manes.caffeine:caffeine:3.2.0') {
        version {
            strictly '[3.2,3.3)'
        }
    }


    jarJar('com.esotericsoftware:kryo:5.6.2') {
        version {
            strictly '[5.6,5.7)'
        }
    }

    // Embed occlusionculling into final jar (no relocation)
    jarJar("com.logisticscraft:occlusionculling:0.0.8-SNAPSHOT") {
    }

    // Embed LWJGL OpenCL bindings to satisfy org.lwjgl.opencl.CL at runtime
    jarJar("org.lwjgl:lwjgl-opencl:3.3.3") {
    }

}

tasks.withType(JavaCompile).configureEach {
    options.release = 22
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = uri("file://${project.projectDir}/repo") }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}